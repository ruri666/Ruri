[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-life-agent"
version = "0.1.0"
description = "Persistent Life Agent V1 with deterministic lifecycle and file-backed memory"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
